# Based on https://docs.astral.sh/uv/guides/integration/github/
name: Install deps

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: 'uv.lock'

    - name: Install dependencies
      run: uv sync --locked
      shell: bash
