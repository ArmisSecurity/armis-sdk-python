  "TD003",  # Missing issue link on the line following TODO
  "TD004",  # Missing colon in TODO
  "TD005",  # Missing issue description after TODO
  "FIX001", # Line contains FIXME
  "FIX002", # Line contains TODO
  "FIX003", # Line contains XXX
